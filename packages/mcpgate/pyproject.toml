[project]
name = "mcpgate"
version = "0.1.0"
description = "A security gateway for MCP: per-caller tool allowlists, tool-poisoning and rug-pull detection, output injection scanning, rate limits and an audit log."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The local prompt-injection classifier (CPU) as a second layer behind the heuristics.
classifier = ["transformers>=4.50", "torch>=2.5"]

[project.scripts]
mcpgate = "mcpgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpgate"]
