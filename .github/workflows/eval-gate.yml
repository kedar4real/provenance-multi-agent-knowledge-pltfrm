name: eval-gate

# The retrieval regression gate. Deterministic, no LLM, no API keys: it restores the search
# index from a dump attached to a release, runs hybrid search + rerank over every golden
# case, and fails the PR if recall or MRR drop below the recorded floors, if anyone sees
# another sector's data, or if golden cases were removed. See docs/ci.md.

on:
  pull_request:
    paths:
      - "src/provenance/retrieval/**"
      - "src/provenance/ingest/**"
      - "src/provenance/security/**"
      - "src/provenance/db/**"
      - "db/**"
      - "eval/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  RLS_SIGNING_KEY: ci-only-signing-key # not a secret: throwaway CI database
  UV_FROZEN: "1"
  INDEX_RELEASE: eval-index-v1

jobs:
  retrieval:
    name: retrieval gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync

      - name: Cache the embedding and reranker models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5-bge-reranker-base-v1

      - name: Check the index release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$INDEX_RELEASE" >/dev/null 2>&1; then
            echo "::error::Release '$INDEX_RELEASE' not found. Export the index and upload it once (docs/ci.md)."
            exit 1
          fi

      - name: Start Postgres and migrate
        run: |
          docker compose up -d --wait postgres
          uv run python -m provenance.db.migrate

      - name: Restore the search index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$INDEX_RELEASE" --pattern index.dump --dir data
          uv run python scripts/index_dump.py restore data/index.dump

      - name: Run the gate
        run: uv run python -m eval.gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: eval/reports/gate-latest.json
          if-no-files-found: ignore
