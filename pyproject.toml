[project]
name = "provenance"
version = "0.1.0"
description = "Secure multi-agent knowledge platform: supervisor/worker agents, hybrid RAG, calibrated verification, MCP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.99",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "langgraph>=0.6",
    "mcp>=1.13",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
    "pgvector>=0.5.0",
    "selectolax>=0.4.13",
    "sentence-transformers>=6.1.0",
    "numpy>=2.5.3",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "redis>=8.1.0",
    "sqlglot>=30.21.0",
    "scikit-learn>=1.9.1",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
]

[project.scripts]
provenance-mcp = "provenance.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance"]

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pre-commit>=4.3",
    "asgi-lifespan>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]  # the formatter owns line length; long strings are allowed

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs the docker compose services running"]
