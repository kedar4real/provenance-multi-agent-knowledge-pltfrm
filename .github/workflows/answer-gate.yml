name: answer-gate

# The answer-quality gate: 25 fixed golden questions through the real agent and an LLM judge
# on free tiers. Fails on a regression in correctness, faithfulness or refusals, or on any
# leak. A run that quota keeps from answering enough questions is inconclusive (a warning),
# not a failure. Needs GEMINI_API_KEY and GROQ_API_KEY as repository secrets; without them it
# skips. See docs/ci.md.

on:
  pull_request:
    paths:
      - "src/provenance/agents/**"
      - "src/provenance/llm/**"
      - "src/provenance/sql/**"
      - "src/provenance/verifier/**"
      - "src/provenance/controller/**"
      - "config/llm.yaml"
      - "config/routing.yaml"
      - "eval/answer_gate.py"
      - "eval/answer_thresholds.yaml"
      - ".github/workflows/answer-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: answer-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  RLS_SIGNING_KEY: ci-only-signing-key # not a secret: throwaway CI database
  UV_FROZEN: "1"
  INDEX_RELEASE: eval-index-v1

jobs:
  answers:
    name: answer gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Skip without model keys
        id: keys
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::GEMINI_API_KEY / GROQ_API_KEY secrets not set; answer gate skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.run == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.keys.outputs.run == 'true'
        with:
          enable-cache: true
      - if: steps.keys.outputs.run == 'true'
        run: uv sync

      - name: Cache the encoder models
        if: steps.keys.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5-bge-reranker-base-nli-v1

      - name: Start Postgres and Redis, migrate
        if: steps.keys.outputs.run == 'true'
        run: |
          docker compose up -d --wait postgres redis
          uv run python -m provenance.db.migrate

      - name: Restore the search index
        if: steps.keys.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$INDEX_RELEASE" --pattern index.dump --dir data
          uv run python scripts/index_dump.py restore data/index.dump

      - name: Run the gate
        if: steps.keys.outputs.run == 'true'
        run: uv run python -m eval.answer_gate
